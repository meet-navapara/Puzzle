name: block_garden
description: PetalGrid — an original block-placement puzzle garden for Android and iOS.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.5
  http: ^1.5.0
  firebase_core: ^4.1.1
  firebase_auth: ^6.0.3
  cloud_firestore: ^6.0.2
  google_sign_in: ^7.1.1
  google_mobile_ads: ^9.1.0
  flutter_animate: ^4.5.2
  uuid: ^4.5.1
  collection: ^1.19.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.5.0
  build_runner: ^2.7.1
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#1A3D32"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/audio/
    - assets/legal/
